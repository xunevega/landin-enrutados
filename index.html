<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enrutados | Optimización Inteligente de Rutas</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg-dark: #0f172a;
      --text-main: #334155;
      --text-light: #f8fafc;
      --accent: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { color: var(--text-main); background-color: #fff; line-height: 1.6; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 5%; background: #fff; }
    .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
    .btn-cta { background: var(--primary); color: #fff; padding: 0.75rem 1.5rem; border-radius: 8px; text-decoration: none; font-weight: 600; transition: background 0.2s; }
    .btn-cta:hover { background: var(--primary-dark); }

    /* Hero Section */
    .hero { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; padding: 4rem 5%; align-items: center; max-width: 1200px; margin: 0 auto; }
    .hero-content h1 { font-size: 3rem; line-height: 1.1; color: var(--bg-dark); margin-bottom: 1.5rem; }
    .hero-content p { font-size: 1.25rem; color: #64748b; margin-bottom: 2rem; }
    
    /* Device Frame para la Demo */
    .demo-frame {
      border: 12px solid #1e293b;
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      height: 600px;
      background: #f1f5f9;
      position: relative;
    }
    .demo-frame iframe { width: 100%; height: 100%; border: none; }

    /* Responsive */
    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; text-align: center; }
      .demo-frame { height: 500px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Enrutados</div>
    <a href="#demo" class="btn-cta">Probar Ahora</a>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>Rutas más rápidas. Menos combustible.</h1>
        <p>Calcula y optimiza tus secuencias de entrega en tiempo real. La herramienta definitiva para logística urbana.</p>
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <a href="#demo" class="btn-cta" style="background: var(--accent);">Ver Demo Interactiva</a>
          <a href="#pricing" class="btn-cta" style="background: #e2e8f0; color: var(--bg-dark);">Ver Planes</a>
        </div>
      </div>

      <!-- Contenedor optimizado de la Demo -->
      <div class="demo-frame" id="demo">
        <!-- Puedes cargar la demo vía iframe o directamente embebiendo la app -->
        <iframe src="demo.html" title="Demo Interactiva Enrutados"></iframe>
      </div>
    </section>
  </main>

</body>
</html>
